services:
  app:
    # Set IMAGE to your own GHCR image, e.g. ghcr.io/<owner>/<repo>:main
    image: ${IMAGE:-ghcr.io/OWNER/REPO:main}
    restart: unless-stopped
    ports:
      - '${HOST_PORT:-3000}:3000'
    environment:
      - NODE_ENV=production
      - PORT=3000
      - PUBLIC_URL=${PUBLIC_URL}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
